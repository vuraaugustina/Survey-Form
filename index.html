<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="title">Survey Form</h1>
        <p id="description">Let us know what you think about software development</p>
    </header>
    
    <main>
        <form id="survey-form">
            <!-- Name Input -->
            <div class="form-group">
                <label id="name-label" for="name">* Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>

            <!-- Email Input -->
            <div class="form-group">
                <label id="email-label" for="email">* Email:</label>
                <input type="email" id="email" placeholder="Enter your Email" required>
            </div>

            <!-- Age Input -->
            <div class="form-group">
                <label id="number-label" for="number">* Age:</label>
                <input type="number" id="number" min="10" max="120" placeholder="Age" required>
            </div>

            <!-- Role Dropdown -->
            <div class="form-group">
                <label for="dropdown">Which option best describes your current role?</label>
                <select id="dropdown" name="role">
                    <option value="student" selected>Student</option>
                    <option value="job">Full Time Job</option>
                    <option value="learner">Full Time Learner</option>
                    <option value="preferNo">Prefer not to say</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Radio Buttons -->
            <div class="form-group">
                <label>* How likely is that you would learn software development</label>
                <div class="radio-checkbox-group">
                    <label><input type="radio" name="recommend" value="definitely"> Definitely</label>
                    <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
                    <label><input type="radio" name="recommend" value="not-sure"> Not sure</label>
                </div>
            </div>

            <!-- Feature Dropdown -->
            <div class="form-group">
                <label for="most-like">Which do you prefer easy in SD:</label>
                <select id="most-like" name="mostLike">
                    <option disabled selected value>Select an option</option>
                    <option value="html">HTML</option>
                    <option value="css">css</option>
                    <option value="community">Javascript</option>
                    <option value="openSource">Open Source</option>
                </select>
            </div>

            </div>

            <!-- Submit Button -->
            <div class="form-group button-container">
                <button type="submit" id="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
